name: Daily Job Scrape

on:
  schedule:
    # 06:15 UTC daily. Avoid :00 — GitHub's scheduler is heavily contended on
    # the hour and runs get queued for a long time.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      query:
        description: "Search term to scrape"
        required: false
        default: "data engineer"
      pages:
        description: "Max pages to walk"
        required: false
        default: "3"

# Stop a manual run and the nightly run from committing over each other.
concurrency:
  group: job-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write   # needed to commit the refreshed dataset back

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        # Guards the pure logic the smoke test can't distinguish a regression in:
        # a broken normaliser or skill pattern still produces *a* dataset, just a
        # quietly wrong one, and the only symptom downstream is a dip in row
        # count that nobody reads. These fail loudly instead.
        run: python -m pytest -q

      - name: Smoke test against the offline fixtures
        # Runs the full pipeline with no network, once per input shape: the HTML
        # fixture covers the scraper + cleaning path, the JSON fixture covers
        # every API adapter. If either is broken this fails in seconds and we
        # never hit the live provider.
        run: |
          python run.py --sample
          python run.py --sample-api

      - name: Discard fixture output
        # The smoke test writes its results into data/cleaned/. Clear them before
        # the live run so neither the uploaded artifact nor the commit step can
        # ever publish fixture rows (whose source_url is a local file:// path)
        # as if they were real listings. .gitkeep is tracked, so keep it.
        run: find data/cleaned -type f ! -name '.gitkeep' -delete

      - name: Run live scrape
        id: scrape
        # run.py's exit codes carry three distinct meanings:
        #   0 = listings collected
        #   1 = ran fine, found nothing (a bad day on the board, not a bug)
        #   2 = unrecoverable error
        #
        # `continue-on-error: true` cannot express that. It collapses every
        # non-zero exit into `outcome: failure`, so the "found nothing" case
        # tripped the fail-the-run step below exactly like a crash — the run went
        # red on a day the pipeline had behaved correctly. The code is captured
        # explicitly here and classified into an output the later steps branch
        # on, which is what the comment above always claimed happened.
        run: |
          set +e
          python run.py \
            --query "${{ github.event.inputs.query || 'data engineer' }}" \
            --pages "${{ github.event.inputs.pages || '3' }}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "status=ok"    >> "$GITHUB_OUTPUT" ;;
            1) echo "status=empty" >> "$GITHUB_OUTPUT" ;;
            *) echo "status=error" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload datasets as build artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: job-data-${{ github.run_number }}
          path: |
            data/cleaned/
            data/raw/
          retention-days: 14
          if-no-files-found: warn

      - name: Commit refreshed dataset
        # Only publish data from a scrape that actually succeeded. Without this
        # guard a failed scrape leaves whatever is in data/cleaned/ to be
        # force-added and pushed — which is how fixture data reached main.
        if: steps.scrape.outputs.status == 'ok'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f because data/cleaned is gitignored locally (see .gitignore):
          # only real scrapes produced by this workflow get published.
          git add -f data/cleaned
          # `git diff --cached --quiet` exits 0 when nothing is staged, which is
          # the normal outcome when the board hasn't changed. Skip the commit.
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh job dataset $(date -u +%Y-%m-%d)"
          # This job is not the only writer on main, so a rejected push is an
          # expected outcome rather than an exceptional one — any human commit
          # landing during the ~30s scrape is enough to cause it. Rebase onto
          # whatever arrived and retry instead of failing the run over a race.
          for attempt in 1 2 3; do
            if git push; then
              echo "Dataset published on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "::error::Could not publish the dataset after 3 push attempts."
          exit 1

      - name: Note an empty scrape
        # Not a failure: the pipeline worked, every provider in the chain just
        # had nothing to give. Surfaced as a warning so a run of empty days is
        # visible in the Actions list without any of them going red.
        if: steps.scrape.outputs.status == 'empty'
        run: |
          echo "::warning::Live scrape ran cleanly but collected no listings. \
          Dataset left unchanged."

      - name: Fail the run if the live scrape errored
        # Deferred to the end so artifacts are always uploaded first.
        if: steps.scrape.outputs.status == 'error'
        run: |
          echo "::error::run.py exited ${{ steps.scrape.outputs.exit_code }} \
          (unrecoverable) — check the scrape step log."
          exit 1
